name: Refactor modules migration

on:
  push:
    paths:
      - tools/refactor_index.py
      - .github/workflows/refactor-modules.yml

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply migration
        run: python tools/refactor_index.py
      - name: Validate JavaScript syntax
        run: |
          node --check js/core/gameHelpers.js
          node --check js/app/bootstrap.js
          node --check js/app/lifecycle.js
          node --check js/battle/gameController.js
          node --check js/sandbox/controller.js
          node --check js/sandbox/scenarios.js
          node --check js/ui/cardViewModel.js
          node --check js/ui/renderVals.js
      - name: Validate diff
        run: git diff --check
      - name: Commit migrated entrypoints
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html "Marvel Fan Cards.dc.html"
          git commit -m "refactor: finalize modular runtime entrypoint"
          git push
